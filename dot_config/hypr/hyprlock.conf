# Hyprlock — Catppuccin Mocha
# See https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

general {
    # grace = 5
}

background {
    monitor =
    # Use a screenshot of the current desktop, blurred
    path = screenshot
    blur_passes = 3
    blur_size = 6
    noise = 0.01
    contrast = 1.0
    brightness = 0.7
    vibrancy = 0.2
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(b4befeff)
    inner_color = rgba(313244ff)
    font_color = rgba(cdd6f4ff)
    check_color = rgba(a6e3a1ff)
    fail_color = rgba(f38ba8ff)
    fade_on_empty = false
    rounding = 10
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = $TIME
    font_size = 72
    font_family = FiraCode Nerd Font
    color = rgba(cdd6f4ff)
    position = 0, 120
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 20
    font_family = FiraCode Nerd Font
    color = rgba(a6adc8ff)
    position = 0, 50
    halign = center
    valign = center
}
