# Hyprpaper — wallpaper configuration
# See https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/
#
# Place a wallpaper image and update the path below.
# Example:
#   preload = ~/Pictures/wallpaper.jpg
#   wallpaper = ,~/Pictures/wallpaper.jpg
#
# Until a wallpaper is configured, Hyprland will show a plain background.
