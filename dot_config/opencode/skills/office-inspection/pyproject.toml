[project]
name = "office-inspection"
version = "0.2.0"
description = "Read-only, cross-platform OOXML inspection and comparison"
requires-python = ">=3.12"
dependencies = ["defusedxml==0.7.1"]

[dependency-groups]
dev = ["ruff==0.14.3", "ty==0.0.24"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

[tool.ty.environment]
extra-paths = ["scripts"]
