# Picom Configuration
#
# X11 compositor for shadows and transparency.
# Using xrender backend for compatibility with xrdp.
#
# See: https://man.archlinux.org/man/picom.1

# --- Backend ---
backend = "xrender";
vsync = false;

# --- Shadows ---
shadow = true;
shadow-radius = 6;
shadow-opacity = 0.75;
shadow-offset-x = -6;
shadow-offset-y = -6;
shadow-color = "#1e1e2e";

# Exclude shadows on certain windows
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Polybar'",
    "class_g = 'i3-frame'",
    "_GTK_FRAME_EXTENTS@:c",
];

# --- Fading ---
# Disabled — keep things snappy, especially over RDP.
fading = false;

# --- Opacity ---
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;

# --- General ---
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
use-damage = true;

# --- Window type settings ---
wintypes:
{
    tooltip = { shadow = false; };
    dock = { shadow = false; };
    dnd = { shadow = false; };
    popup_menu = { shadow = true; };
    dropdown_menu = { shadow = true; };
};
